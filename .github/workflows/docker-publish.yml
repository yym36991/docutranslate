name: Docker Publish (ghcr.io)

# 推送到本分支（或手动触发）时，用仓库自带的 Dockerfile 构建镜像并发布到
# GitHub Container Registry：ghcr.io/<owner>/docutranslate
# 注意：放在独立分支上是为了保持 yym_add_txt（提 PR 用）的干净。

on:
  push:
    branches: [docker-publish]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:yym_add_txt
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
